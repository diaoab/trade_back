# Deploiement de la version web sur Render (New > Blueprint, choisir ce
# depot). L'API est deployee depuis le depot trade_back.

services:
  # Version web de l'app (meme code que l'app mobile).
  - type: web
    name: finadvisor-web
    runtime: static
    buildCommand: npm ci && npx expo export --platform web
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: EXPO_PUBLIC_API_URL
        sync: false
